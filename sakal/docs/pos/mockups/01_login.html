<!-- layout: PIN-pad primary login (device already bound to a terminal); password login is a secondary, rarely-used link -->
<title>POS Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#1B3A6B; --navy-2:#122A50; --gold:#D4860B; --gold-2:#F0A838;
  --positive:#2E7D32; --negative:#C62828;
  --bg:#F5F7FA; --surface:#FFFFFF; --border:#E1E6ED; --text:#16213A; --text-dim:#5B6472;
  --font-d:'Manrope',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1526; --surface:#162038; --border:#263352; --text:#EAF0FC; --text-dim:#97A4C2; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0E1526; --surface:#162038; --border:#263352; --text:#EAF0FC; --text-dim:#97A4C2; color-scheme:dark; }
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font-b);background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%, #0B1830 100%);color:var(--text);min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;}
.wrap{width:100%;max-width:400px;}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px;color:#fff;}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;color:var(--navy-2);font-size:16px;}
.brand .name{font-family:var(--font-d);font-weight:800;font-size:17px;}
.context{text-align:center;color:#B9C6E6;font-size:12.5px;margin-bottom:22px;}
.context b{color:#fff;}
.card{background:var(--surface);border-radius:22px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.who{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
.who .av{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;width:62px;}
.who .circ{width:50px;height:50px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;color:var(--navy);font-size:16px;}
.who .circ.sel{border-color:var(--gold);background:rgba(212,134,11,.1);}
.who .nm{font-size:10.5px;text-align:center;color:var(--text-dim);white-space:nowrap;}
.pintitle{text-align:center;font-family:var(--font-d);font-weight:800;font-size:15px;margin-bottom:4px;}
.pinsub{text-align:center;font-size:12.5px;color:var(--text-dim);margin-bottom:16px;}
.dots{display:flex;justify-content:center;gap:12px;margin-bottom:18px;}
.pdot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);}
.pdot.on{background:var(--navy);border-color:var(--navy);}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.key{height:58px;border-radius:14px;border:1px solid var(--border);background:var(--bg);font-size:20px;font-weight:700;color:var(--text);cursor:pointer;}
.key.wide{font-size:13px;color:var(--text-dim);font-weight:600;}
.altlink{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--navy);background:none;border:none;cursor:pointer;text-decoration:underline;}
.terminal-chip{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 14px;font-size:12.5px;color:var(--text-dim);margin-top:16px;}
.terminal-chip b{color:var(--text);font-weight:700;}
.offline{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:14px;font-size:12px;color:#B9C6E6;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--positive);}
</style>

<div class="wrap">
  <div class="brand"><div class="mark">S</div><div class="name">SAKAL POS</div></div>
  <div class="context">Steel-Lumumba · <b>Till 1 — Front Counter</b> (this device)</div>

  <div class="card">
    <div class="who">
      <div class="av"><div class="circ sel">AK</div><div class="nm">Anjali</div></div>
      <div class="av"><div class="circ">JP</div><div class="nm">Jay</div></div>
      <div class="av"><div class="circ">NS</div><div class="nm">Nitin</div></div>
    </div>

    <p class="pintitle">Enter your PIN</p>
    <p class="pinsub">Anjali K. — Cashier</p>

    <div class="dots"><div class="pdot on"></div><div class="pdot on"></div><div class="pdot on"></div><div class="pdot"></div></div>

    <div class="keys">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key wide">Clear</button><button class="key">0</button><button class="key wide">⌫</button>
    </div>

    <button class="altlink">Forgot your PIN? Ask a manager to reset it</button>

    <div class="terminal-chip"><span>Device</span><b>Front-Counter-iPad-02 (bound)</b></div>
    <div class="offline"><span class="dot"></span> Online — PIN verified instantly</div>
    <div class="offline" style="margin-top:2px;">🔒 No password is ever used at this till</div>
  </div>
</div>
