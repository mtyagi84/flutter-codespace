<!-- layout: kiosk-style, big scan field + one large result card, read-only -->
<title>Price Check</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#1B3A6B; --navy-2:#122A50; --gold:#D4860B; --positive:#2E7D32; --negative:#C62828;
  --bg:#F5F7FA; --surface:#FFFFFF; --border:#E1E6ED; --text:#16213A; --text-dim:#5B6472;
  --font-d:'Manrope',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E1526; --surface:#162038; --border:#263352; --text:#EAF0FC; --text-dim:#97A4C2; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0E1526; --surface:#162038; --border:#263352; --text:#EAF0FC; --text-dim:#97A4C2; color-scheme:dark; }
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-b);background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:28px 16px;}
.brand{font-family:var(--font-d);font-weight:800;color:var(--navy);font-size:16px;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.scan{width:100%;max-width:520px;height:64px;border-radius:16px;border:2px solid var(--gold);background:var(--surface);padding:0 20px;font-size:19px;text-align:center;color:var(--text);margin-bottom:28px;}
.scan:focus{outline:none;}
.card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:28px;text-align:center;}
.thumb{width:84px;height:84px;border-radius:20px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 14px;}
.name{font-family:var(--font-d);font-weight:800;font-size:20px;margin-bottom:4px;}
.sub{font-size:13px;color:var(--text-dim);margin-bottom:20px;}
.price{font-family:var(--font-d);font-weight:800;font-size:46px;color:var(--navy);line-height:1;}
.price small{font-size:18px;font-weight:700;color:var(--text-dim);}
.alt{font-size:14px;color:var(--gold);font-weight:700;margin-top:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:left;}
.stat{background:var(--bg);border-radius:12px;padding:12px 14px;}
.stat .l{font-size:11px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.4px;}
.stat .v{font-weight:700;font-size:14.5px;margin-top:2px;}
.stat .v.in{color:var(--positive);}
.promo{margin-top:16px;background:#FFF4E2;border:1px solid var(--gold);color:#7A4A00;border-radius:12px;padding:10px 14px;font-size:13px;}
</style>

<div class="brand">🔎 SAKAL POS — Price Check</div>
<input class="scan" placeholder="Scan or type a barcode / SKU…" value="890123456781" autofocus />

<div class="card">
  <div class="thumb">🧴</div>
  <div class="name">Sunlight Dish Soap 750ml</div>
  <div class="sub">SKU SDS-750 · Barcode 890123456781</div>
  <div class="price">2,850 <small>CDF</small></div>
  <div class="alt">≈ 1.01 USD at today's rate</div>

  <div class="promo">🎉 Buy 2 Get 10% Off — active until 30 Sep</div>

  <div class="grid2">
    <div class="stat"><div class="l">Stock on hand</div><div class="v in">42 units</div></div>
    <div class="stat"><div class="l">Tax</div><div class="v">VAT 16%</div></div>
    <div class="stat"><div class="l">Unit</div><div class="v">Pcs</div></div>
    <div class="stat"><div class="l">Category</div><div class="v">Household</div></div>
  </div>
</div>
